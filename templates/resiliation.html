{% extends "base.html" %}
{% block title %}Demande de résiliation · Boutique Meindjo{% endblock %}
{% block content %}
<h1>Demande de résiliation</h1>
<p class="intro">Nous traitons votre demande avec soin, réponse sous 24 h ouvrées.</p>
<form method="post" data-final novalidate>
  <label for="nom">Nom complet</label>
  <input id="nom" name="nom" placeholder="Marie Dupont" value="{{ data.get('nom', '') }}" required>
  <label for="email">Adresse email</label>
  <input id="email" type="email" name="email" placeholder="marie.dupont@email.fr" value="{{ data.get('email', '') }}" required>
  <label for="order_number">Numéro de commande ou de contrat</label>
  <input id="order_number" name="order_number" placeholder="MJ-10234" value="{{ data.get('order_number', '') }}" required>
  <label for="motif">Motif de résiliation</label>
  <select id="motif" name="motif" required>
    <option value="">Sélectionnez un motif…</option>
    {% for m in motifs %}
    <option value="{{ m }}" {% if data.get('motif') == m %}selected{% endif %}>{{ m }}</option>
    {% endfor %}
  </select>
  <label for="date_souhaitee">Date de résiliation souhaitée <span style="text-transform:none;color:#94A3B8;font-weight:400">(optionnel)</span></label>
  <input id="date_souhaitee" type="date" name="date_souhaitee" value="{{ data.get('date_souhaitee', '') }}">
  <div class="actions">
    <a class="retour" href="{{ url_for('accueil') }}">← Accueil</a>
    <button class="btn" type="submit">Envoyer ma demande →</button>
  </div>
</form>
{% endblock %}
