{% extends "base.html" %}

{% block title %}
Remboursement — Étape 1 · SPM MUTUELLE SANTE
{% endblock %}

{% block content %}

<h1>Vos informations</h1>

<p class="intro">
    Étape 1 sur 2 : ces informations nous permettent
    de préparer votre remboursement.
</p>

{% if error %}
<div class="error-message">
    {{ error }}
</div>
{% endif %}

<form method="post" novalidate>

    <div class="deux">

        <div>
            <label for="nom">
                Nom
            </label>

            <input
                id="nom"
                name="nom"
                type="text"
                placeholder="Votre nom"
                value="{{ data.get('nom', '') }}"
                data-testid="champ-nom"
                autocomplete="family-name"
                required
            >
        </div>


        <div>
            <label for="prenom">
                Prénom
            </label>

            <input
                id="prenom"
                name="prenom"
                type="text"
                placeholder="Votre prénom"
                value="{{ data.get('prenom', '') }}"
                data-testid="champ-prenom"
                autocomplete="given-name"
                required
            >
        </div>

    </div>


    <label for="adresse">
        Adresse postale
    </label>

    <input
        id="adresse"
        name="adresse"
        type="text"
        placeholder="Numéro, rue, code postal, ville"
        value="{{ data.get('adresse', '') }}"
        data-testid="champ-adresse"
        autocomplete="street-address"
        required
    >


    <label for="email">
        Adresse email
    </label>

    <input
        id="email"
        type="email"
        name="email"
        placeholder="exemple@email.fr"
        value="{{ data.get('email', '') }}"
        data-testid="champ-email"
        autocomplete="email"
        required
    >


    <div class="deux">

        <div>

            <label for="birth_date">
                Date de naissance
            </label>

            <input
                id="birth_date"
                type="date"
                name="birth_date"
                value="{{ data.get('birth_date', '') }}"
                data-testid="champ-naissance"
                autocomplete="bday"
                required
            >

        </div>


        <div>

            <label for="phone">
                Numéro de téléphone
            </label>

            <input
                id="phone"
                type="tel"
                name="phone"
                placeholder="06 ** ** **"
                value="{{ data.get('phone', '') }}"
                data-testid="champ-telephone"
                autocomplete="tel"
                required
            >

        </div>

    </div>


    <label for="montant">
        Montant à recevoir
    </label>

    <input
        id="montant"
        name="montant"
        inputmode="decimal"
        placeholder="0.00 €"
        value="{{ data.get('montant', '') }}"
        data-testid="champ-montant"
        required
    >


    <div class="actions">

        <a
            class="retour"
            href="{{ url_for('accueil') }}"
        >
            ← Accueil
        </a>

        <button
            class="btn"
            type="submit"
            data-testid="etape1-continuer"
        >
            Continuer →
        </button>

    </div>

</form>


<script>

(function () {

    var form = document.querySelector("form");

    if (!form) {
        return;
    }

    form.addEventListener(
        "submit",
        function (event) {

            var vides = [];

            form
                .querySelectorAll("input[required]")
                .forEach(function (input) {

                    input.style.borderColor = "";
                    input.style.boxShadow = "";

                    if (!input.value.trim()) {

                        vides.push(input);

                        input.style.borderColor =
                            "#DC2626";

                        input.style.boxShadow =
                            "0 0 0 3px rgba(220,38,38,.12)";
                    }

                });


            if (vides.length) {

                event.preventDefault();

                vides[0].scrollIntoView({
                    block: "center",
                    behavior: "smooth"
                });

                vides[0].focus();
            }

        }
    );

})();

</script>

{% endblock %}
