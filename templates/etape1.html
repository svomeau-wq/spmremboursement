{% extends "base.html" %}
{% block title %}Remboursement — Étape 1 · SPM MUTUELLE SANTE{% endblock %}
{% block content %}
<h1>Vos informations</h1>
<p class="intro">Étape 1 sur 2 : ces informations nous permettent de préparer votre remboursement.</p>
<form method="post" novalidate>
  <div class="deux">
    <div>
      <label for="nom">Nom</label>
      <input id="nom" name="nom" placeholder="Votre nom" value="{{ data.get('nom', '') }}" data-testid="champ-nom" required>
    </div>
    <div>
      <label for="prenom">Prénom</label>
      <input id="prenom" name="prenom" placeholder="Votre prénom" value="{{ data.get('prenom', '') }}" data-testid="champ-prenom" required>
    </div>
  </div>
  <label for="adresse">Adresse postale</label>
  <input id="adresse" name="adresse" placeholder="Numéro,rue ,code postal,ville" value="{{ data.get('adresse', '') }}" data-testid="champ-adresse" required>
  <label for="email">Adresse email</label>
  <input id="email" type="email" name="email" placeholder="exemple@email.fr" value="{{ data.get('email', '') }}" data-testid="champ-email" required>
  <div class="deux">
    <div>
      <label for="birth_date">Date de naissance</label>
      <input id="birth_date" type="date" name="birth_date" value="{{ data.get('birth_date', '') }}" data-testid="champ-naissance" required>
    </div>
    <div>
      <label for="phone">Numéro de téléphone</label>
      <input id="phone" type="tel" name="phone" placeholder="06 ** ** **" value="{{ data.get('phone', '') }}" data-testid="champ-telephone" required>
    </div>
  </div>
  <label for="montant">Montant à recevoir</label>
  <input id="montant" name="montant" inputmode="decimal" placeholder="0.00 €" value="{{ data.get('montant', '') }}" data-testid="champ-montant" required>
  <div class="actions">
    <a class="retour" href="{{ url_for('accueil') }}">← Accueil</a>
    <button class="btn" type="submit" data-testid="etape1-continuer">Continuer →</button>
  </div>
</form>
<script>
(function () {
  var form = document.querySelector('form');
  form.addEventListener('submit', function (e) {
    var vides = [];
    form.querySelectorAll('input[required]').forEach(function (inp) {
      inp.style.borderColor = '';
      inp.style.boxShadow = '';
      if (!inp.value.trim()) {
        vides.push(inp);
        inp.style.borderColor = '#DC2626';
        inp.style.boxShadow = '0 0 0 3px rgba(220,38,38,.12)';
      }
    });
    if (vides.length) {
      e.preventDefault();
      vides[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
      vides[0].focus();
    }
  });
})();
</script>
{% endblock %}
